name: Build and Release APK
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Download OpenCV Android SDK
        run: |
          wget --tries=5 --timeout=60 --retry-connrefused --waitretry=5 -q \
            https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          unzip -q opencv-4.10.0-android-sdk.zip
          mkdir -p opencv/src/main/java
          cp -r OpenCV-android-sdk/sdk/java/src/* opencv/src/main/java/
          # Remove ALL camera view classes (unused by app; depend on BuildConfig + res + Camera APIs)
          rm -f opencv/src/main/java/org/opencv/android/*Camera*.java
          # 仅打包 arm64-v8a (现代安卓机型, targetSdk 33 / Android 13)
          mkdir -p opencv/src/main/jniLibs
          cp -r OpenCV-android-sdk/sdk/native/libs/arm64-v8a opencv/src/main/jniLibs/
          rm -rf OpenCV-android-sdk opencv-4.10.0-android-sdk.zip
          echo "=== opencv jniLibs ==="
          find opencv/src/main/jniLibs -name "*.so" -ls
      - name: Download U2Net TFLite model
        run: |
          mkdir -p app/src/main/assets/models
          wget --tries=5 --timeout=60 --retry-connrefused --waitretry=5 -q -O app/src/main/assets/models/u2net.tflite \
            https://storage.googleapis.com/ailia-models-tflite/u2net/u2netp_float32.tflite || \
          wget --tries=5 --timeout=60 --retry-connrefused --waitretry=5 -q -O app/src/main/assets/models/u2net.tflite \
            https://storage.googleapis.com/ailia-models-tflite/u2net/u2netp_full_integer_quant.tflite
          ls -lh app/src/main/assets/models/
      - name: Fetch palettes and generate icon
        run: |
          pip install pillow
          python3 scripts/fetch_palettes.py
          python3 scripts/generate_icon.py
          ls -lh app/src/main/assets/palettes/
      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore $HOME/pindou.keystore \
            -alias pindou -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pindou123 -keypass pindou123 \
            -dname "CN=Pindou, OU=App, O=Pindou, L=Beijing, ST=Beijing, C=CN"
          echo "PINDOU_KEYSTORE_PATH=$HOME/pindou.keystore" >> $GITHUB_ENV
          echo "PINDOU_KEYSTORE_PASS=pindou123" >> $GITHUB_ENV
          echo "PINDOU_KEY_ALIAS=pindou" >> $GITHUB_ENV
          echo "PINDOU_KEY_PASS=pindou123" >> $GITHUB_ENV
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
      - name: Zipalign APK
        run: |
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign 2>/dev/null | head -1)
          echo "zipalign: $ZIPALIGN"
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1)
          echo "apksigner: $APKSIGNER"
          SRC=app/build/outputs/apk/release/app-release.apk
          ALIGNED=/tmp/app-release-aligned.apk
          $ZIPALIGN -f -p 4 "$SRC" "$ALIGNED"
          $APKSIGNER sign --ks $HOME/pindou.keystore --ks-pass pass:pindou123 \
            --ks-key-alias pindou --key-pass pass:pindou123 --out "$SRC" "$ALIGNED"
          $APKSIGNER verify --verbose "$SRC" 2>&1 | head -5
      - name: Verify APK native libs
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "=== .so files in APK ==="
          unzip -l "$APK" | grep -E "\.so" || { echo "ERROR: NO .so FILES!"; exit 1; }
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/
            build/reports/
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pindou-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/pindou-${{ github.ref_name }}.apk
          ls -lh output/
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            # 拼豆 ${{ github.ref_name }}
            ## 新功能
            - **图像增强**: 解决拍照光线问题, 提升拼豆颜色匹配准确度
              - 一键自动增强: 智能组合白平衡 + CLAHE + Gamma
              - 白平衡 (灰世界算法): 消除色偏, 还原真实色彩
              - CLAHE 对比度增强: 改善局部光线不均, 可调强度
              - Gamma 亮度校正: 提亮暗照/压暗过曝, 可调参数
            - 项目持久化: 保存/加载/删除项目, 支持缩略图列表
            - 图片旋转: HomeScreen 和 ExtractScreen 均可旋转原图
            - 保存到相册: ExportScreen 直接保存图纸到相册 (MediaStore)
            - 图纸统计: 显示尺寸、颜色种类数、总颗数
            - 未保存修改提示: 返回时弹出确认对话框
            - Snackbar 消息提示: 保存/加载/删除操作反馈
            - 项目列表页: 浏览已保存项目, 点击加载
            ## 修复
            - OpenCV native 库加载: extractNativeLibs=true + useLegacyPackaging=true
            - TFLite 初始化异步执行, 失败降级到手动 GrabCut
            - Bitmap 回收: 全链路回收, 无内存泄漏
            - 协程串行化: startProcessing 取消上一次未完成操作
            - 滑块防抖: 拖动时延迟清除 grid, 避免频繁重置
            - 颜色量化: 浮点除法 + 四舍五入, 避免整数截断偏暗
            - 采样区间左闭右开, 跳过透明像素
            - PaletteRegistry: ConcurrentHashMap + key 格式校验
            - ManualSegmenter/OpenCVInitializer: 共享懒加载, 不崩溃
            - Exporter: CSV 转义 + 输出尺寸上限 + 越界保护
            - 资源清理: 移除未使用的颜色和权限
            ## 下载
            - `pindou-${{ github.ref_name }}.apk` - arm64-v8a (适配 Android 8.0+ / targetSdk 33 Android 13)
          files: |
            output/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
