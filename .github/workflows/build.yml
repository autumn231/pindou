name: Build and Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Download OpenCV Android SDK
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          unzip -q opencv-4.10.0-android-sdk.zip
          mkdir -p opencv/src/main/java
          cp -r OpenCV-android-sdk/sdk/java/src/* opencv/src/main/java/
          # Remove ALL camera view classes (unused by app; depend on BuildConfig + res + Camera APIs)
          rm -f opencv/src/main/java/org/opencv/android/*Camera*.java
          # 仅打包 arm64-v8a (现代安卓机型, targetSdk 33 / Android 13)
          mkdir -p opencv/src/main/jniLibs
          cp -r OpenCV-android-sdk/sdk/native/libs/arm64-v8a opencv/src/main/jniLibs/
          rm -rf OpenCV-android-sdk opencv-4.10.0-android-sdk.zip
          echo "=== opencv jniLibs ==="
          find opencv/src/main/jniLibs -name "*.so" -ls
          echo "=== opencv android sources remaining ==="
          ls opencv/src/main/java/org/opencv/android/
      - name: Download U2Net TFLite model
        run: |
          mkdir -p app/src/main/assets/models
          wget -q -O app/src/main/assets/models/u2net.tflite \
            https://storage.googleapis.com/ailia-models-tflite/u2net/u2netp_float32.tflite || \
          wget -q -O app/src/main/assets/models/u2net.tflite \
            https://storage.googleapis.com/ailia-models-tflite/u2net/u2netp_full_integer_quant.tflite
          ls -lh app/src/main/assets/models/
      - name: Fetch palettes and generate icon
        run: |
          pip install pillow
          python3 scripts/fetch_palettes.py
          python3 scripts/generate_icon.py
          ls -lh app/src/main/assets/palettes/
      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore $HOME/pindou.keystore \
            -alias pindou -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pindou123 -keypass pindou123 \
            -dname "CN=Pindou, OU=App, O=Pindou, L=Beijing, ST=Beijing, C=CN"
          echo "PINDOU_KEYSTORE_PATH=$HOME/pindou.keystore" >> $GITHUB_ENV
          echo "PINDOU_KEYSTORE_PASS=pindou123" >> $GITHUB_ENV
          echo "PINDOU_KEY_ALIAS=pindou" >> $GITHUB_ENV
          echo "PINDOU_KEY_PASS=pindou123" >> $GITHUB_ENV
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
      - name: Verify APK native libs
        run: |
          echo "=== APK contents (.so files) ==="
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "\.so" || \
            { echo "ERROR: NO .so FILES IN APK!"; exit 1; }
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/
            build/reports/
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/pindou-v1.0.apk
          ls -lh output/
      - name: Create Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: v1.0
          body: |
            # 拼豆 v1.0
            首个版本。
            ## 功能
            - 图片转拼豆图纸 (Lab + CIEDE2000 色差匹配)
            - 主体提取 (TFLite U2Net 自动 + OpenCV GrabCut 手动)
            - 三套调色板 (Artkal C、Artkal S、MARD)
            - Floyd-Steinberg 抖动 (可选)
            - 用料清单导出 PNG/CSV
            ## 下载
            - `pindou-v1.0.apk` - arm64-v8a (适配 Android 8.0+ / targetSdk 33 Android 13)
          files: |
            output/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
