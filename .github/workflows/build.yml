name: Build and Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Download OpenCV Android SDK
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          unzip -q opencv-4.10.0-android-sdk.zip
          mkdir -p opencv/src/main/java
          cp -r OpenCV-android-sdk/sdk/java/src/* opencv/src/main/java/
          # Remove ALL camera view classes (unused by app; depend on BuildConfig + res + Camera APIs)
          rm -f opencv/src/main/java/org/opencv/android/*Camera*.java
          # 仅打包 arm64-v8a (现代安卓机型, targetSdk 33 / Android 13)
          mkdir -p opencv/src/main/jniLibs
          cp -r OpenCV-android-sdk/sdk/native/libs/arm64-v8a opencv/src/main/jniLibs/
          rm -rf OpenCV-android-sdk opencv-4.10.0-android-sdk.zip
          echo "=== opencv jniLibs ==="
          find opencv/src/main/jniLibs -name "*.so" -ls
      - name: Download U2Net TFLite model
        run: |
          mkdir -p app/src/main/assets/models
          wget -q -O app/src/main/assets/models/u2net.tflite \
            https://storage.googleapis.com/ailia-models-tflite/u2net/u2netp_float32.tflite || \
          wget -q -O app/src/main/assets/models/u2net.tflite \
            https://storage.googleapis.com/ailia-models-tflite/u2net/u2netp_full_integer_quant.tflite
          ls -lh app/src/main/assets/models/
      - name: Fetch palettes and generate icon
        run: |
          pip install pillow
          python3 scripts/fetch_palettes.py
          python3 scripts/generate_icon.py
          ls -lh app/src/main/assets/palettes/
      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore $HOME/pindou.keystore \
            -alias pindou -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pindou123 -keypass pindou123 \
            -dname "CN=Pindou, OU=App, O=Pindou, L=Beijing, ST=Beijing, C=CN"
          echo "PINDOU_KEYSTORE_PATH=$HOME/pindou.keystore" >> $GITHUB_ENV
          echo "PINDOU_KEYSTORE_PASS=pindou123" >> $GITHUB_ENV
          echo "PINDOU_KEY_ALIAS=pindou" >> $GITHUB_ENV
          echo "PINDOU_KEY_PASS=pindou123" >> $GITHUB_ENV
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
      - name: Zipalign APK (page-align .so for in-place mmap)
        run: |
          # AGP 输出的 APK 已签名但可能未页对齐; 用 SDK 的 zipalign -p 4 强制 4KB 页对齐
          # 这是 extractNativeLibs=false 时 .so 能被 mmap 加载的关键
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign 2>/dev/null | head -1)
          echo "zipalign: $ZIPALIGN"
          APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1)
          echo "apksigner: $APKSIGNER"
          SRC=app/build/outputs/apk/release/app-release.apk
          ALIGNED=/tmp/app-release-aligned.apk
          $ZIPALIGN -f -p 4 "$SRC" "$ALIGNED"
          # 重新签名 (zipalign 后签名失效)
          $APKSIGNER sign --ks $HOME/pindou.keystore --ks-pass pass:pindou123 \
            --ks-key-alias pindou --key-pass pass:pindou123 --out "$SRC" "$ALIGNED"
          $APKSIGNER verify --verbose "$SRC" 2>&1 | head -5
      - name: Verify APK native libs + alignment
        run: |
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign 2>/dev/null | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          echo "=== zipalign check ==="
          $ZIPALIGN -c -p 4 "$APK" 2>&1 && echo "OK: page-aligned" || echo "WARN: not page-aligned"
          echo "=== .so files in APK ==="
          unzip -l "$APK" | grep -E "\.so" || { echo "ERROR: NO .so FILES!"; exit 1; }
          echo "=== extractNativeLibs + compression ==="
          pip install --quiet androguard
          python3 -c "
          import logging; logging.disable(logging.CRITICAL)
          import zipfile
          from androguard.core.apk import APK
          a = APK('$APK')
          app = a.xml['AndroidManifest.xml'].find('.//application')
          ns = '{http://schemas.android.com/apk/res/android}'
          print('extractNativeLibs:', app.get(ns+'extractNativeLibs'))
          z = zipfile.ZipFile('$APK')
          for f in a.get_files():
              if f.endswith('.so'):
                  zi = z.getinfo(f)
                  method = 'Stored' if zi.compress_type == 0 else 'Deflated'
                  print(f'{f}: {method}, compressed={zi.compress_size}, uncompressed={zi.file_size}')
          "
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/
            build/reports/
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/pindou-v1.0.2.apk
          ls -lh output/
      - name: Create Release v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: v1.0.2
          body: |
            # 拼豆 v1.0.2
            修复 GrabCut 闪退 (.so 加载失败)。
            ## 修复
            - 改用 `extractNativeLibs=false` + `useLegacyPackaging=false` (现代打包方式)
            - 构建后用 `zipalign -p 4` 强制页对齐, 确保 .so 可被直接 mmap 加载
            - 根因: 之前 .so 以 Deflated 压缩且未页对齐, 导致 `dlopen` 失败 → `Mat.n_Mat()` 找不到 JNI 实现
            ## 下载
            - `pindou-v1.0.2.apk` - arm64-v8a (适配 Android 8.0+ / targetSdk 33 Android 13)
          files: |
            output/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
